<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<defs>
 <pattern id="boards" width="44" height="44" patternUnits="userSpaceOnUse"><rect width="44" height="44" fill="#735b43"/><path d="M0 0h44M0 22h44" stroke="#493729" stroke-width="3"/><path d="M12 0v22M34 22v22" stroke="#5b4533"/></pattern>
 <pattern id="stone" width="50" height="32" patternUnits="userSpaceOnUse"><rect width="50" height="32" fill="#565047"/><path d="M0 0h50v32H0zM25 0v16M0 16h50" fill="none" stroke="#39352f" stroke-width="3"/></pattern>
</defs>
<rect width="1200" height="800" fill="#283128"/><rect x="90" y="70" width="1020" height="660" fill="#2b231d"/><rect x="120" y="100" width="960" height="600" fill="url(#boards)"/>
<!-- subtly different floor finishes make the service rooms readable without labels -->
<rect x="690" y="100" width="210" height="305" fill="#806449" opacity=".32"/><rect x="900" y="100" width="180" height="305" fill="#5d4938" opacity=".36"/><rect x="690" y="405" width="210" height="295" fill="#6d513d" opacity=".25"/><rect x="900" y="405" width="180" height="295" fill="#594332" opacity=".3"/>
<path d="M690 100v600M900 100v600M690 405h390M900 405h180" stroke="#2b231d" stroke-width="24"/><path d="M120 540h570" stroke="#2b231d" stroke-width="24"/>
<!-- common-room hearth, tables, benches, and entrance -->
<rect x="155" y="140" width="130" height="105" fill="url(#stone)" stroke="#2b231d" stroke-width="10"/><path d="M185 230l35-70 35 70" fill="#a15d35" opacity=".8"/>
<g fill="#4b3829" stroke="#2b231d" stroke-width="7"><rect x="335" y="180" width="145" height="72"/><rect x="500" y="330" width="140" height="72"/><rect x="255" y="385" width="140" height="72"/></g><g fill="#a68d64"><circle cx="350" cy="165" r="15"/><circle cx="460" cy="165" r="15"/><circle cx="515" cy="315" r="15"/><circle cx="625" cy="315" r="15"/><circle cx="270" cy="370" r="15"/><circle cx="380" cy="370" r="15"/></g>
<g fill="#a79b7a" stroke="#2b231d" stroke-width="8"><rect x="105" y="330" width="30" height="85"/><rect x="1065" y="280" width="30" height="85"/><rect x="485" y="685" width="90" height="30"/></g>
<g fill="#8ea09a" stroke="#2b231d" stroke-width="7"><rect x="330" y="85" width="95" height="30"/><rect x="590" y="85" width="95" height="30"/><rect x="190" y="685" width="95" height="30"/></g>
<!-- central staircase, with a landing and handrails rather than a symbolic cross -->
<rect x="555" y="115" width="110" height="330" fill="#493628" stroke="#2b231d" stroke-width="9"/><path d="M580 140h60M580 200h60M580 260h60M580 320h60M580 380h60" stroke="#a0845c" stroke-width="14"/><path d="M570 130v275M650 130v275" fill="none" stroke="#30241d" stroke-width="6"/>
<!-- kitchen/service: stove, work counters, shelves, and rear door -->
<rect x="715" y="125" width="155" height="60" fill="#4e3929" stroke="#2b231d" stroke-width="8"/><g fill="#b08b5b" stroke="#2b231d" stroke-width="5"><circle cx="750" cy="155" r="12"/><circle cx="790" cy="155" r="12"/><circle cx="830" cy="155" r="12"/></g>
<g fill="#83715a" stroke="#2b231d" stroke-width="6"><rect x="725" y="245" width="80" height="55"/><rect x="830" y="245" width="45" height="80"/><rect x="730" y="350" width="135" height="35"/></g><g fill="#c6ad78" stroke="#3d2e22" stroke-width="4"><circle cx="745" cy="263" r="7"/><circle cx="770" cy="263" r="7"/><rect x="842" y="256" width="20" height="9"/></g>
<!-- bar/store: long bar, shelving, bottles, and service counter -->
<g fill="#5a4533" stroke="#2b231d" stroke-width="7"><rect x="925" y="130" width="125" height="65"/><rect x="930" y="245" width="80" height="55"/><rect x="940" y="335" width="95" height="40"/></g><path d="M938 151h100M938 173h100" stroke="#a2875d" stroke-width="6"/><g fill="#b99b63"><rect x="947" y="140" width="8" height="20"/><rect x="967" y="140" width="8" height="20"/><rect x="987" y="140" width="8" height="20"/><rect x="1007" y="140" width="8" height="20"/></g>
<!-- staff sleeping room: two recognizable beds and a small chest -->
<g fill="#4d3a2d" stroke="#2b231d" stroke-width="7"><rect x="725" y="455" width="140" height="70"/><rect x="735" y="570" width="100" height="65"/></g><g fill="#c4b187" stroke="#3d3025" stroke-width="4"><rect x="735" y="465" width="120" height="23"/><rect x="745" y="580" width="80" height="20"/></g><g fill="#e0d2ac"><rect x="742" y="469" width="32" height="15"/><rect x="752" y="584" width="27" height="13"/></g>
<!-- service room: shelving, work table, and basin -->
<g fill="#4d3a2d" stroke="#2b231d" stroke-width="7"><rect x="925" y="465" width="120" height="65"/><rect x="940" y="575" width="95" height="45"/></g><path d="M938 485h94M938 508h94" stroke="#a2875d" stroke-width="7"/><rect x="956" y="550" width="62" height="20" fill="#7f694b" stroke="#2b231d" stroke-width="5"/><ellipse cx="1000" cy="600" rx="20" ry="10" fill="#9eb0a8" stroke="#2b231d" stroke-width="5"/>
<!-- simple hinged doors make the entrances legible without floating symbols -->
<g fill="#a79b7a" stroke="#2b231d" stroke-width="6"><path d="M135 332h34v81h-34z"/><path d="M1065 282h-34v81h34z"/><path d="M485 680h90v30h-90z"/></g><g fill="#2f251f"><circle cx="161" cy="372" r="4"/><circle cx="1038" cy="322" r="4"/><circle cx="548" cy="695" r="4"/></g>
</svg>
