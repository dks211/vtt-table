<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<defs><pattern id="boards" width="48" height="48" patternUnits="userSpaceOnUse"><rect width="48" height="48" fill="#705840"/><path d="M0 0h48M0 24h48" stroke="#493629" stroke-width="3"/><path d="M16 0v24M37 24v24" stroke="#5a4432"/></pattern></defs>
